<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMTIDAAD Workflow Tracker</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e6eb;--acc:#b3202a;--acc2:#8d1821;--ok:#1f8a4c;--warn:#c27a00;--bad:#c4262e;--blue:#2457a6;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{min-height:100vh}
.top{display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;background:#1c2430;color:#fff;position:sticky;top:0;z-index:5}
.brand{font-weight:700;letter-spacing:.3px}.brand b{color:#ff6b73}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.nav button{background:none;border:0;color:#c9d0da;padding:8px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.nav button:hover{background:#2a3444}.nav button.on{background:var(--acc);color:#fff}
.who{font-size:13px;color:#c9d0da;white-space:nowrap}.who button{margin-left:8px;background:#2a3444;border:0;color:#fff;border-radius:6px;padding:5px 9px;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 14px}h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .n{font-size:26px;font-weight:700}.kpi .l{color:var(--mute);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
.kpi.bad .n{color:var(--bad)}.kpi.warn .n{color:var(--warn)}.kpi.good .n{color:var(--ok)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#fafbfc}
.tw{overflow-x:auto}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#eef0f4;color:#445}
.chip.Sales{background:#e6efff;color:#1d4b99}.chip.Operations{background:#e5f6ec;color:#17693a}.chip.Procurement{background:#fff0d9;color:#8a5200}.chip.Finance{background:#f3e8fb;color:#6a2a96}.chip.Management{background:#e8eaee;color:#333}
.chip.late{background:#fde7e8;color:var(--bad)}.chip.ok{background:#e3f5ea;color:var(--ok)}.chip.amber{background:#fff0d6;color:var(--warn)}.chip.closed{background:#e3f5ea;color:var(--ok)}.chip.open{background:#e6efff;color:var(--blue)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600}.btn:hover{background:var(--acc2)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #cfd4dc}.btn.sec:hover{background:#f2f4f7}
.btn.sm{padding:4px 9px;font-size:12.5px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:#1c2430;color:#fff;border-color:#1c2430}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
input,select,textarea{border:1px solid #cfd4dc;border-radius:7px;padding:7px 9px;background:#fff;width:100%}
.row input,.row select{width:auto}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 3px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0}.bar .lb{width:100px;font-size:13px}.bar .tr{flex:1;background:#eef0f4;height:14px;border-radius:7px;overflow:hidden}.bar .fi{height:100%;background:var(--acc)}.bar .v{width:110px;font-size:12.5px;color:var(--mute);text-align:right}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}
.dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:#eef0f4;color:var(--mute)}
.dot.done{background:var(--ok);color:#fff}.dot.active{background:var(--blue);color:#fff}.dot.over{background:var(--bad);color:#fff}.dot.skip{background:#aab2bf;color:#fff}
.step .b{flex:1;min-width:0}.step .t{font-weight:600}.step .m{color:var(--mute);font-size:12.5px;margin-top:2px}

.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}.tabs button.on{background:#1c2430;color:#fff;border-color:#1c2430}
.log{max-height:620px;overflow:auto}.ev{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.ev .m{color:var(--mute);font-size:12px}

.msg{margin:8px 0;max-width:92%}.msg .h{font-size:12px;color:var(--mute)}.msg .x{background:#f1f3f6;border-radius:10px;padding:7px 10px;display:inline-block;white-space:pre-wrap;word-break:break-word}.msg.me{margin-left:auto;text-align:right}.msg.me .x{background:#fbe5e7}
.chat form{display:flex;gap:8px;margin-top:8px}
.modalbg{position:fixed;inset:0;background:rgba(20,26,36,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:#fff;border-radius:12px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto}
.modal h2{font-size:17px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:9px 16px;border-radius:8px;z-index:30}
.login{max-width:380px;margin:9vh auto}
.muted{color:var(--mute)}.small{font-size:12.5px}.err{color:var(--bad);font-size:13px;margin-top:8px}

<body>
<div id="app"></div>
<div id="modal"></div>
<script src="firebase-config.js"></script>
<script>
"use strict";
/* ============ CONSTANTS ============ */
const DEPTS=['Sales','Operations','Procurement','Finance','Management'];
const H=3600e3,D=24*H,DUBAI='+04:00';
const TRIG_HELP='One-time job triggers: reg (at registration), delivered, mobil, progress, completed, certReq, certIssued. AMC triggers: reg, ppm:N (after visit N), allppm, date:M (M months after start).';

/* ---- legacy workflow: orders created before payment plans existed keep using this ---- */
const WFL={
  AMC:{label:'AMC (1-year service contract)',steps:[
    {k:'reg',name:'Sales order registered (LPO received)',dept:'Sales',after:[],sla:0},
    {k:'service',name:'Service executed by Operations',dept:'Operations',after:['reg'],sla:168},
    {k:'report',name:'Service report shared with Sales',dept:'Operations',after:['service'],sla:48},
    {k:'finInfo',name:'Finance informed to invoice',dept:'Operations',after:['service'],sla:24},
    {k:'invoice',name:'Invoice generated and submitted to client',dept:'Finance',after:['finInfo'],sla:48,fields:[{n:'invoiceNo',l:'Invoice number'},{n:'invoiceAmt',l:'Invoice amount (AED)',type:'number'}]},
    {k:'paid',name:'Payment received',dept:'Finance',after:['invoice'],sla:'terms',fields:[{n:'payRef',l:'Payment reference'}]}
  ]},
  OTJ:{label:'One-time job',steps:[
    {k:'reg',name:'Sales order registered',dept:'Sales',after:[],sla:0},
    {k:'matReq',name:'Material requested from Procurement',dept:'Operations',after:['reg'],sla:24,skippable:true},
    {k:'fundReq',name:'Procurement submits material cost and requests funds',dept:'Procurement',after:['matReq'],sla:24,skippable:true,fields:[{n:'amountReq',l:'Funds requested (AED)',type:'number'},{n:'supplier',l:'Supplier / PO reference'}]},
    {k:'fundRel',name:'Finance releases funds for material',dept:'Finance',after:['fundReq'],sla:48,skippable:true,fund:true,fields:[{n:'amountRel',l:'Amount released (AED)',type:'number'},{n:'relRef',l:'Payment reference'},{n:'relMode',l:'Release',type:'select',opts:['Full amount released','Partial release — more to follow']}]},
    {k:'matOk',name:'Procurement confirms material (full / progressive)',dept:'Procurement',after:['fundRel'],sla:72,skippable:true,fields:[{n:'matMode',l:'Material availability',type:'select',opts:['All material available','Partial — proceed progressively']}]},
    {k:'exec',name:'Job executed by Operations',dept:'Operations',after:['matOk'],sla:168},
    {k:'report',name:'Completion report shared with Finance',dept:'Operations',after:['exec'],sla:24},
    {k:'invoice',name:'Invoice generated and submitted to client',dept:'Finance',after:['report'],sla:48,fields:[{n:'invoiceNo',l:'Invoice number'},{n:'invoiceAmt',l:'Invoice amount (AED)',type:'number'}]},
    {k:'paid',name:'Payment received',dept:'Finance',after:['invoice'],sla:'terms',fields:[{n:'payRef',l:'Payment reference'}]}
  ]}
};
/* ---- current workflow: work steps only; billing runs per instalment ---- */
const OTJ_FUND=[
  {k:'matReq',name:'Material requested from Procurement',dept:'Operations',sla:24,skippable:true},
  {k:'fundReq',name:'Procurement submits material cost and requests funds',dept:'Procurement',sla:24,skippable:true,fields:[{n:'amountReq',l:'Funds requested (AED)',type:'number'},{n:'supplier',l:'Supplier / PO reference'}]},
  {k:'fundRel',name:'Finance releases funds for material',dept:'Finance',sla:48,skippable:true,fund:true,fields:[{n:'amountRel',l:'Amount released (AED)',type:'number'},{n:'relRef',l:'Payment reference'},{n:'relMode',l:'Release',type:'select',opts:['Full amount released','Partial release — more to follow']}]},
  {k:'matOk',name:'Procurement confirms material (full / progressive)',dept:'Procurement',sla:72,skippable:true,fields:[{n:'matMode',l:'Material availability',type:'select',opts:['All material available','Partial — proceed progressively']}]}
];
function stepsFor(o){
  if(!o.inst)return WFL[o.type]?WFL[o.type].steps:[];
  const reg={k:'reg',name:'Sales order registered',dept:'Sales',after:[],sla:0};
  const trig=Object.values(o.inst).map(i=>i.trigger);
  if(o.type==='AMC'){
    const n=Number(o.visits)||4,start=o.startDate||o.createdAt;const a=[reg];
    for(let i=1;i<=n;i++)a.push({k:'ppm'+i,sk:'ppm',name:'PPM visit '+i+' of '+n+' executed and report shared',dept:'Operations',after:['reg'],sla:168,nb:start+Math.round((i-1)*365/n*D)});
    return a;
  }
  const a=[reg];let prev='reg';
  OTJ_FUND.forEach(s=>{a.push({...s,after:[prev]});prev=s.k});
  if(trig.includes('delivered')){a.push({k:'delivered',name:'Material delivered to site',dept:'Operations',after:[prev],sla:120});prev='delivered'}
  if(trig.includes('mobil')){a.push({k:'mobil',name:'Mobilization done',dept:'Operations',after:[prev],sla:72});prev='mobil'}
  a.push({k:'exec',name:'Job executed by Operations',dept:'Operations',after:[prev],sla:168});
  a.push({k:'report',name:'Completion report shared with Finance',dept:'Operations',after:['exec'],sla:24});
  if(trig.includes('certReq')||trig.includes('certIssued')){
    a.push({k:'certReq',name:'Completion certificate requested from client',dept:'Operations',after:['report'],sla:48});
    a.push({k:'certIssued',name:'Completion certificate issued by client',dept:'Operations',after:['certReq'],sla:168});
  }
  return a;
}
const SLA_DEFS=[
  ['AMC','ppm','PPM visit executed and report shared (counted from its scheduled date)','Operations',168],
  ['OTJ','matReq','Material requested','Operations',24],['OTJ','fundReq','Procurement requests funds','Procurement',24],['OTJ','fundRel','Finance releases funds','Finance',48],['OTJ','matOk','Procurement confirms material','Procurement',72],
  ['OTJ','delivered','Material delivered to site','Operations',120],['OTJ','mobil','Mobilization done','Operations',72],['OTJ','exec','Job executed','Operations',168],['OTJ','report','Completion report shared','Operations',24],
  ['OTJ','certReq','Certificate requested','Operations',48],['OTJ','certIssued','Certificate issued by client','Operations',168],
  ['BILL','inv','Invoice generated and submitted (from when it is ready)','Finance',48],['BILL','chq','Post-dated cheque received (from invoice)','Finance',168]
];
const DEFAULT_PLANS=[
  {id:'p1',name:'100% advance',types:['OTJ','AMC'],pdc:0,lines:'100|Advance|reg'},
  {id:'p2',name:'100% after completion',types:['OTJ'],pdc:0,lines:'100|On completion|completed'},
  {id:'p3',name:'50% advance, 50% after completion',types:['OTJ'],pdc:0,lines:'50|Advance|reg\n50|After completion|completed'},
  {id:'p4',name:'50% upon material delivery, 50% after completion',types:['OTJ'],pdc:0,lines:'50|Material delivery|delivered\n50|After completion|completed'},
  {id:'p5',name:'50% upon mobilization, 50% after completion',types:['OTJ'],pdc:0,lines:'50|Mobilization|mobil\n50|After completion|completed'},
  {id:'p6',name:'50% progressive, 50% after completion',types:['OTJ'],pdc:0,lines:'50|Progress claims|progress\n50|After completion|completed'},
  {id:'p7',name:'50% advance, 40% work completion, 10% before certificate',types:['OTJ'],pdc:0,lines:'50|Advance|reg\n40|Work completion|completed\n10|Before certificate issuing|certReq'},
  {id:'p8',name:'75% advance, 25% before certificate',types:['OTJ'],pdc:0,lines:'75|Advance|reg\n25|Before certificate issuing|certReq'},
  {id:'p9',name:'30% advance, 20% material delivery, 30% progressive, 20% before certificate',types:['OTJ'],pdc:0,lines:'30|Advance|reg\n20|Material delivery|delivered\n30|Progress claims|progress\n20|Before certificate issuing|certReq'},
  {id:'p10',name:'100% after completion, 30 days PDC',types:['OTJ'],pdc:30,lines:'100|After completion|completed'},
  {id:'p11',name:'100% after completion, 45 days PDC',types:['OTJ'],pdc:45,lines:'100|After completion|completed'},
  {id:'p12',name:'100% after completion, 60 days PDC',types:['OTJ'],pdc:60,lines:'100|After completion|completed'},
  {id:'p13',name:'100% after completion, 90 days PDC',types:['OTJ'],pdc:90,lines:'100|After completion|completed'},
  {id:'a1',name:'AMC: 50% advance, 50% against PPM 2',types:['AMC'],pdc:0,lines:'50|Advance|reg\n50|Against PPM 2|ppm:2'},
  {id:'a2',name:'AMC: quarterly (4 x 25%)',types:['AMC'],pdc:0,lines:'25|Quarter 1|date:0\n25|Quarter 2|date:3\n25|Quarter 3|date:6\n25|Quarter 4|date:9'}
];

/* ============ STORE (Firebase Firestore) ============ */
/* orders/{SO}                 order header, steps, instalments (billing)
   orders/{SO}/events/{id}     append-only activity log
   orders/{SO}/chat/{id}       append-only chat
   users/{id}, settings/sla, settings/plans                               */
let store=null;
async function makeFirebaseStore(cfg){
  const V='13.4.0',base='https://www.gstatic.com/firebasejs/'+V+'/';
  const A=await import(base+'firebase-app.js'),F=await import(base+'firebase-firestore.js'),Au=await import(base+'firebase-auth.js');
  const app=A.initializeApp(cfg);const auth=Au.getAuth(app);
  await Au.signInAnonymously(auth);
  const db=F.getFirestore(app);
  const ref=p=>F.doc(db,...p.split('/'));const col=p=>F.collection(db,...p.split('/'));
  return{
    watchCol(p,cb,err){return F.onSnapshot(col(p),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>err&&err(e))},
    watchDoc(p,cb){return F.onSnapshot(ref(p),s=>cb(s.exists()?s.data():null),()=>{})},
    set(p,d){return F.setDoc(ref(p),d)},
    update(p,d){return F.updateDoc(ref(p),d)},
    del(p){return F.deleteDoc(ref(p))},
    async batch(ops){const b=F.writeBatch(db);ops.forEach(o=>{if(o.t==='add')b.set(F.doc(col(o.p)),o.d);else if(o.t==='set')b.set(ref(o.p),o.d);else b.update(ref(o.p),o.d)});await b.commit()}
  };
}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const oid=so=>String(so).trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,120);
const dtf=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const dtd=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',day:'2-digit',month:'short',year:'numeric'});
const fmt=t=>t?dtf.format(new Date(t)):'—';
const fmtD=t=>t?dtd.format(new Date(t)):'—';
function dur(ms){ms=Math.max(0,ms||0);const d=Math.floor(ms/D),h=Math.floor(ms%D/H),m=Math.floor(ms%H/60e3);if(d)return d+'d '+h+'h';if(h)return h+'h '+m+'m';return m+'m'}
const aed=n=>'AED '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const parseDay=s=>s?Date.parse(s+'T00:00:00'+DUBAI):NaN;
function addMonths(ts,m){const d=new Date(ts+4*H);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+m,d.getUTCDate())-4*H}
async function hashPin(pin,id){const s=pin+':'+id;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}}
function applyDot(obj,path,val){const ks=path.split('.');let t=obj;for(let i=0;i<ks.length-1;i++){t=t[ks[i]]=(t[ks[i]]&&typeof t[ks[i]]==='object')?t[ks[i]]:{}}t[ks[ks.length-1]]=val}
const TRIG_TXT={reg:'order registration',delivered:'material delivered',mobil:'mobilization done',progress:'progress claims',completed:'work completion',certReq:'certificate request',certIssued:'certificate issued',allppm:'all PPM visits done',claim:'progress claim'};
function trigText(t){if(!t)return'';if(t.startsWith('ppm:'))return'PPM visit '+t.slice(4);if(t.startsWith('date:'))return t==='date:0'?'contract start':'start + '+t.slice(5)+' months';return TRIG_TXT[t]||t}

/* ============ STATE ============ */
const S={user:null,view:'dash',orderId:null,tab:'log',users:[],orders:[],sla:{},plansDoc:null,chat:[],events:[],loaded:{users:false,orders:false},q:'',ft:'',fs:'open',fd:'',err:'',loadErr:false,period:'month'};
let unsubs=[],rafId=0;
const plansList=()=>S.plansDoc&&S.plansDoc.list?Object.values(S.plansDoc.list):DEFAULT_PLANS;

/* ============ WORKFLOW ENGINE ============ */
function slaMsOf(o,st){
  if(st.sla==='terms')return(o.terms||30)*D;
  const type=st.bill?'BILL':o.type;const key=st.sk||st.k;
  const v=S.sla&&S.sla[type]&&S.sla[type][key];
  return(v!=null?Number(v):(st.sla||0))*H;
}
function finishRow(r,o,now){
  if(r.state==='active'){r.elapsed=now-r.readyAt;r.late=r.slaMs>0&&r.elapsed>r.slaMs;r.over=r.late?r.elapsed-r.slaMs:0}
  if(r.state==='done'){r.took=r.readyAt!=null?Math.max(0,r.doneAt-r.readyAt):0;r.lateDone=r.slaMs>0&&r.took>r.slaMs;r.over=r.lateDone?r.took-r.slaMs:0}
  r.owner=(r.st.k==='paid'&&o.escalatedAt&&r.state==='active')?'Sales':r.st.dept;
}
function analyze(o,now=Date.now()){
  const defs=stepsFor(o),steps=o.steps||{},out={};
  const res=defs.map(st=>{const rec=steps[st.k];const r={st,rec,state:'waiting',readyAt:null,slaMs:slaMsOf(o,st)};
    if(rec&&rec.doneAt){r.state=rec.skipped?'skipped':'done';r.doneAt=rec.doneAt}out[st.k]=r;return r});
  for(let i=res.length-1;i>=0;i--){const r=res[i];
    if(r.state==='waiting'&&res.some(d=>d.st.after.includes(r.st.k)&&(d.state==='done'||d.state==='skipped'))){r.state='skipped';r.legacy=true;r.doneAt=null}}
  res.forEach(r=>{
    const pre=r.st.after.map(k=>out[k]).filter(Boolean);
    const ok=pre.every(p=>p.state==='done'||p.state==='skipped');
    if(ok){const ts=pre.map(p=>p.doneAt).filter(Boolean);let t=ts.length?Math.max(...ts):o.createdAt;if(r.st.nb)t=Math.max(t,r.st.nb);r.readyAt=t;
      if(r.state==='waiting'){if(t<=now)r.state='active';else r.upcoming=true}}
    finishRow(r,o,now)});
  return res;
}
function trigAt(o,work,i){
  if(i.claim)return i.readyAt||null;
  const t=i.trigger;if(t==='reg')return o.createdAt;
  const w=k=>{const r=work.find(x=>x.st.k===k);return r&&r.state==='done'?r.doneAt:null};
  if(t==='completed')return w('report');
  if(t==='delivered'||t==='mobil'||t==='certReq'||t==='certIssued')return w(t);
  if(t.startsWith('ppm:'))return w('ppm'+t.slice(4));
  if(t==='allppm'){const p=work.filter(x=>x.st.k.startsWith('ppm'));return p.length&&p.every(x=>x.state==='done')?Math.max(...p.map(x=>x.doneAt)):null}
  if(t.startsWith('date:'))return addMonths(o.startDate||o.createdAt,Number(t.slice(5)));
  return null;
}
const instSorted=o=>Object.entries(o.inst||{}).sort((a,b)=>(a[1].ord||0)-(b[1].ord||0));
const BILL_FIELDS={
  inv:[{n:'invoiceNo',l:'Invoice number'},{n:'invoiceAmt',l:'Invoice amount (AED)',type:'number'}],
  chq:[{n:'chequeNo',l:'Cheque number'},{n:'bank',l:'Bank'},{n:'chequeDate',l:'Cheque date',type:'date'}],
  paid:[{n:'amtCollected',l:'Amount collected (AED)',type:'number'},{n:'payRef',l:'Payment / clearance reference'}]
};
function billRows(o,now=Date.now(),work){
  if(!o.inst)return[];work=work||analyze(o,now);const rows=[];
  instSorted(o).forEach(([key,i])=>{
    if(i.container)return;
    const ready=trigAt(o,work,i),pdc=!!i.pdcDays;
    const mk=(k,name,ok,prereq,slaMs)=>{
      const rec=i[k];const r={st:{k,name,dept:'Finance',bill:true,fields:BILL_FIELDS[k],sla:0},rec,ikey:key,inst:i,state:'waiting',readyAt:null,slaMs};
      if(rec&&rec.doneAt){r.state='done';r.doneAt=rec.doneAt}
      if(ok){r.readyAt=prereq;if(r.state==='waiting'){if(prereq<=now)r.state='active';else r.upcoming=true}}
      finishRow(r,o,now);rows.push(r);return r};
    const inv=mk('inv','Invoice generated and submitted to client',ready!=null,ready,slaMsOf(o,{bill:true,k:'inv',sla:48}));
    let prev=inv;
    if(pdc){prev=mk('chq','Post-dated cheque received',inv.state==='done',inv.doneAt,slaMsOf(o,{bill:true,k:'chq',sla:168}))}
    const cd=pdc&&prev.rec&&prev.rec.fields?parseDay(prev.rec.fields.chequeDate):NaN;
    const paySla=pdc?(isNaN(cd)?0:Math.max(0,cd-(prev.doneAt||cd)))+3*D:(o.terms||30)*D;
    mk('paid',pdc?'Cheque cleared and payment collected':'Payment received',prev.state==='done',prev.doneAt,paySla);
  });
  return rows;
}
const allActive=(o,now=Date.now())=>{const w=analyze(o,now);return w.concat(billRows(o,now,w)).filter(r=>r.state==='active')};
const activeOf=allActive;
const canAct=(st,u)=>!!u&&(u.role==='admin'||u.dept===st.dept);
function claimedOf(o){const c={};Object.values(o.inst||{}).forEach(i=>{if(i.claim)c[i.parent]=(c[i.parent]||0)+i.pct});return c}
function isComplete(o){
  const w=analyze(o);if(!w.every(r=>r.state==='done'||r.state==='skipped'))return false;
  if(!o.inst)return true;
  const cl=claimedOf(o);
  for(const [k,i] of Object.entries(o.inst))if(i.container&&(cl[k]||0)<i.pct-0.01)return false;
  const b=billRows(o,Date.now(),w).filter(r=>r.st.k==='paid');
  return b.length>0&&b.every(r=>r.state==='done');
}
/* ---- money numbers ---- */
function inPeriod(ts,p){if(!ts)return false;if(p==='all')return true;const d=new Date(ts+4*H),n=new Date(Date.now()+4*H);return d.getUTCFullYear()===n.getUTCFullYear()&&(p==='year'||d.getUTCMonth()===n.getUTCMonth())}
function billItems(o){
  const w=analyze(o);const items=[];
  if(o.inst){
    const b=billRows(o,Date.now(),w);
    instSorted(o).forEach(([key,i])=>{if(i.container)return;
      const inv=b.find(r=>r.ikey===key&&r.st.k==='inv'),pd=b.find(r=>r.ikey===key&&r.st.k==='paid');
      const amount=inv.state==='done'?Number((inv.rec.fields||{}).invoiceAmt||i.amount):i.amount;
      items.push({amount,state:pd.state==='done'?'paid':inv.state==='done'?'invoiced':inv.state==='active'?'ready':'waiting',paidAt:pd.doneAt,collected:pd.state==='done'?Number((pd.rec.fields||{}).amtCollected||amount):0,over:pd.state==='active'&&pd.late})});
  }else{
    const inv=w.find(r=>r.st.k==='invoice'),pd=w.find(r=>r.st.k==='paid');if(!inv||!pd)return items;
    const amount=inv.state==='done'?Number((inv.rec.fields||{}).invoiceAmt||o.value):o.value;
    items.push({amount,state:pd.state==='done'?'paid':inv.state==='done'?'invoiced':inv.state==='active'?'ready':'waiting',paidAt:pd.doneAt,collected:pd.state==='done'?amount:0,over:pd.state==='active'&&pd.late});
  }
  return items;
}
function completedValue(o,p){
  const w=analyze(o);
  if(o.type==='AMC'){
    if(o.inst){const n=w.filter(r=>r.st.k.startsWith('ppm'));return n.filter(r=>r.state==='done'&&inPeriod(r.doneAt,p)).length*(Number(o.value)/(n.length||1))}
    const r=w.find(x=>x.st.k==='finInfo');return r&&r.state==='done'&&inPeriod(r.doneAt,p)?Number(o.value):0;
  }
  const r=w.find(x=>x.st.k==='report');return r&&r.state==='done'&&inPeriod(r.doneAt,p)?Number(o.value):0;
}
function money(p){
  const m={comp:0,coll:0,pend:0,pendOver:0,ready:0};
  S.orders.forEach(o=>{m.comp+=completedValue(o,p);const V=Number(o.value)||0;
    const it=billItems(o);const collAll=it.reduce((a,x)=>a+(x.state==='paid'?x.collected:0),0);
    const f=collAll>V&&collAll>0?V/collAll:1;           // never count more than the job value
    let room=Math.max(0,V-Math.min(V,collAll));
    it.forEach(x=>{
      if(x.state==='paid'){if(inPeriod(x.paidAt,p))m.coll+=x.collected*f}
      else if(x.state==='invoiced'){const a=Math.min(x.amount,room);room-=a;m.pend+=a;if(x.over)m.pendOver+=a}
      else if(x.state==='ready'){const a=Math.min(x.amount,room);room-=a;m.ready+=a}})});
  return m;
}
/* done vs collected per order, capped at the actual job value */
function orderFin(o){
  const V=Number(o.value)||0,it=billItems(o);
  const D=Math.min(V,completedValue(o,'all'));
  const I=Math.min(V,it.reduce((a,x)=>a+(x.state==='invoiced'||x.state==='paid'?x.amount:0),0));
  const C=Math.min(V,it.reduce((a,x)=>a+(x.state==='paid'?x.collected:0),0));
  const cd=Math.min(C,D);
  return{V,D,I,C,cd,adv:C-cd,out:D-cd};
}
function doneView(){
  const rows=S.orders.map(o=>({o,f:orderFin(o)}));
  const t=rows.reduce((a,r)=>({D:a.D+r.f.D,cd:a.cd+r.f.cd,out:a.out+r.f.out,adv:a.adv+r.f.adv,I:a.I+r.f.I}),{D:0,cd:0,out:0,adv:0,I:0});
  const pct=t.D?Math.round(t.cd/t.D*100):0;
  const cl={};rows.forEach(r=>{const k=(r.o.client||'—').trim();const c=cl[k]||(cl[k]={n:0,V:0,D:0,cd:0,out:0,adv:0});c.n++;c.V+=r.f.V;c.D+=r.f.D;c.cd+=r.f.cd;c.out+=r.f.out;c.adv+=r.f.adv});
  const byClient=Object.entries(cl).sort((a,b)=>b[1].out-a[1].out);
  const ord=rows.filter(r=>r.o.status!=='closed'&&(r.f.out>0||r.f.adv>0)).sort((a,b)=>b.f.out-a.f.out);
  return`<h2 style="margin:18px 0 8px">Work done vs money collected <span class="muted small">(all orders; collected never exceeds the job value)</span></h2>
  <div class="grid g4">${tile('Work done',aed(t.D),'completed by Operations')}${tile('Collected against work done',aed(t.cd),pct+'% of work done','good')}${tile('Still to collect on completed work',aed(t.out),'work done minus collected',t.out?'warn':'')}${tile('Advance received',aed(t.adv),'collected before the work is done')}</div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h2>By client</h2><div class="tw"><table><tr><th>Client</th><th>Jobs</th><th>Value</th><th>Done</th><th>Collected</th><th>Outstanding</th></tr>${byClient.map(([k,c])=>`<tr><td>${esc(k)}</td><td>${c.n}</td><td>${aed(c.V)}</td><td>${aed(c.D)}</td><td>${aed(c.cd)}${c.adv?`<div class="small muted">+ ${aed(c.adv)} advance</div>`:''}</td><td><b>${aed(c.out)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No orders yet</td></tr>'}</table></div></div>
  <div class="card"><h2>Open orders with money outstanding</h2><div class="tw"><table><tr><th>SO</th><th>Client</th><th>Value</th><th>Done</th><th>Collected</th><th>Outstanding</th></tr>${ord.map(r=>`<tr class="click" data-act="open" data-id="${esc(r.o.id)}"><td><b>${esc(r.o.so)}</b></td><td>${esc(r.o.client)}</td><td>${aed(r.f.V)}</td><td>${aed(r.f.D)}</td><td>${aed(r.f.cd)}${r.f.adv?`<div class="small muted">+ ${aed(r.f.adv)} advance</div>`:''}</td><td><b>${aed(r.f.out)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nothing outstanding</td></tr>'}</table></div></div></div>`;
}

/* ============ PLANS ============ */
function parseLines(text,type,visits){
  const lines=String(text||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return{err:'Add at least one instalment'};
  const OK=['reg','delivered','mobil','progress','completed','certReq','certIssued'];const inst=[];let sum=0;
  for(let n=0;n<lines.length;n++){
    const [p,l,t]=lines[n].split('|').map(x=>(x||'').trim());const pct=Number(p);
    if(!(pct>0&&pct<=100))return{err:`Line ${n+1}: percentage must be between 1 and 100`};
    if(!l)return{err:`Line ${n+1}: add a label`};
    let ok;
    if(type==='OTJ')ok=OK.includes(t);
    else ok=t==='reg'||t==='allppm'||(/^ppm:\d+$/.test(t)&&Number(t.slice(4))>=1&&Number(t.slice(4))<=visits)||(/^date:\d+$/.test(t)&&Number(t.slice(5))<=11);
    if(!ok)return{err:`Line ${n+1}: trigger "${t||''}" is not valid for ${type==='OTJ'?'one-time jobs':'AMC orders'}. ${TRIG_HELP}`};
    sum+=pct;inst.push({pct,label:l,trigger:t});
  }
  if(Math.abs(sum-100)>0.01)return{err:'Percentages add up to '+sum+'%; they must add up to 100%'};
  return{inst};
}
function buildInst(list,value,pdcDays){
  const m={};list.forEach((x,idx)=>{const o={ord:idx,label:x.label,pct:x.pct,trigger:x.trigger,amount:Math.round(Number(value)*x.pct)/100,pdcDays:x.trigger==='reg'?0:pdcDays};if(x.trigger==='progress')o.container=true;m['i'+(idx+1)]=o});return m;
}

async function commit(o,upd,evs){
  const o2=JSON.parse(JSON.stringify(o));Object.entries(upd).forEach(([k,v])=>applyDot(o2,k,v));
  const ops=evs.map(d=>({t:'add',p:'orders/'+o.id+'/events',d}));
  if(o.status!=='closed'&&isComplete(o2)){upd.status='closed';upd.closedAt=Date.now();ops.push({t:'add',p:'orders/'+o.id+'/events',d:evt('closed','order closed — all work complete and all payments collected')})}
  ops.unshift({t:'update',p:'orders/'+o.id,d:upd});
  await store.batch(ops);
}
async function completeStep(o,st,fd,skipped){
  const ts=Date.now();const fields={};(st.fields||[]).forEach(f=>{if(!skipped)fields[f.n]=fd[f.n]!==undefined?fd[f.n]:''});
  const rec={doneAt:ts,by:S.user.id,byName:S.user.name,byDept:S.user.dept,note:fd.note||'',fields,skipped:!!skipped};
  const behalf=S.user.dept!==st.dept&&S.user.role==='admin'?' (on behalf of '+st.dept+')':'';
  const upd={['steps.'+st.k]:rec};const extra={step:st.k};let etype=skipped?'skip':'done';
  if(st.fund&&!skipped){etype='fund';extra.amount=Number(fields.amountRel||0)}
  if(skipped&&st.k==='fundReq'&&!(o.steps&&o.steps.fundRel))upd['steps.fundRel']={doneAt:ts,by:S.user.id,byName:S.user.name,byDept:S.user.dept,note:'No funds requested',fields:{},skipped:true};
  await commit(o,upd,[evt(etype,(skipped?'skipped step: ':'completed step: ')+st.name+behalf+(st.fund&&!skipped?' — AED '+Number(fields.amountRel||0).toLocaleString('en-US'):'')+(fd.note?' — '+fd.note:''),extra)]);
}
async function completeBill(o,r,fd){
  const ts=Date.now();const fields={};(r.st.fields||[]).forEach(f=>{fields[f.n]=fd[f.n]!==undefined?fd[f.n]:''});
  const rec={doneAt:ts,by:S.user.id,byName:S.user.name,byDept:S.user.dept,note:fd.note||'',fields,skipped:false};
  const behalf=S.user.dept!=='Finance'&&S.user.role==='admin'?' (on behalf of Finance)':'';
  const k=r.st.k;const extra={step:k,inst:r.ikey};let type=k==='inv'?'invoice':k==='chq'?'cheque':'pay';
  if(k==='paid')extra.amount=Number(fields.amtCollected||0);
  const detail=k==='inv'?'invoice '+(fields.invoiceNo||'')+' for AED '+Number(fields.invoiceAmt||0).toLocaleString('en-US')+' generated and submitted to client':k==='chq'?'received PDC no. '+(fields.chequeNo||'')+' ('+(fields.bank||'')+') dated '+(fields.chequeDate||''):'collected AED '+Number(fields.amtCollected||0).toLocaleString('en-US')+(fields.payRef?' (ref '+fields.payRef+')':'');
  await commit(o,{['inst.'+r.ikey+'.'+k]:rec},[evt(type,'['+r.inst.label+'] '+detail+behalf+(fd.note?' — '+fd.note:''),extra)]);
}

  <label>Payment plan</label><select name="plan"></select>
  <label>PDC terms</label>${pdcSelect(0)}
  <label>Instalments — one per line: percentage | label | trigger (edit if this order is different)</label><textarea name="lines" rows="4" style="font-family:monospace;font-size:12.5px"></textarea><div class="small muted">${esc(TRIG_HELP)}</div>`,async fd=>{
    const type=fd.type;const so=fd.so.trim();const id=oid(so);if(!id)throw new Error('Enter a sales order number');
    if(S.orders.some(x=>x.id===id))throw new Error('This sales order number already exists');
    const visits=Number(fd.visits||4);let startDate=null;
    if(type==='AMC'){startDate=parseDay(fd.start);if(isNaN(startDate))throw new Error('Enter the AMC contract start date')}
    const pr=parseLines(fd.lines,type,visits);if(pr.err)throw new Error(pr.err);
    const pdc=Number(fd.pdc||0);const pl=plansList().find(x=>x.id===fd.plan);
    const spu=S.users.find(x=>x.id===fd.sp)||S.user;const ts=Date.now();
    const o={so,type,client:fd.client.trim(),project:fd.project.trim(),value:Number(fd.value),terms:Number(fd.terms||30),lpoRef:fd.lpoRef.trim(),parentSO:parent?parent.so:'',salesperson:spu.name,salespersonId:spu.id,createdAt:ts,createdBy:S.user.id,status:'open',
      plan:{id:pl?pl.id:'custom',name:pl?pl.name:'Custom',pdcDays:pdc},inst:buildInst(pr.inst,fd.value,pdc),
      steps:{reg:{doneAt:ts,by:S.user.id,byName:S.user.name,byDept:S.user.dept,note:'',fields:{},skipped:false}}};
    if(type==='AMC'){o.startDate=startDate;o.visits=visits}
    await store.batch([{t:'set',p:'orders/'+id,d:o},{t:'add',p:'orders/'+id+'/events',d:evt('created','registered sales order '+so+' ('+type+') — plan: '+o.plan.name+(pdc?' · PDC '+pdc+' days':'')+' — handed over to Operations')}]);
    S.orderId=id;S.view='order';S.tab='log';openOrder(id);toast('Sales order registered');
  },'Register order');
  const f=$('#mf');
  f.addEventListener('change',e=>{const n=e.target.name;if(n==='type')planUI(f,f.type.value);else if(n==='plan')planUI(f,f.type.value,f.plan.value)});
  planUI(f,f.type.value);
}
function editPlanModal(o){
  const lines=instSorted(o).map(([,i])=>i.pct+'|'+i.label+'|'+i.trigger).join('\n');
  modal('Change payment plan — '+o.so,`<p class="small muted">Allowed until the first invoice or progress claim. The change is logged.</p><label>PDC terms</label>${pdcSelect(o.plan?o.plan.pdcDays:0)}<label>Instalments — percentage | label | trigger</label><textarea name="lines" rows="5" style="font-family:monospace;font-size:12.5px">${esc(lines)}</textarea><div class="small muted">${esc(TRIG_HELP)}</div>`,async fd=>{
    const pr=parseLines(fd.lines,o.type,Number(o.visits)||4);if(pr.err)throw new Error(pr.err);
    const pdc=Number(fd.pdc||0);
    await postEvent(o,'plan','changed payment plan to: '+pr.inst.map(x=>x.pct+'% '+x.label).join(', ')+(pdc?' · PDC '+pdc+' days':''),{},{inst:buildInst(pr.inst,o.value,pdc),plan:{id:'custom',name:'Custom (edited)',pdcDays:pdc}});toast('Plan updated');
  },'Save plan');
}
function libModal(id){
  const cur=plansList().find(p=>p.id===id)||{id:'',name:'',types:['OTJ'],pdc:0,lines:'100|After completion|completed'};
  modal(id?'Edit payment plan':'New payment plan',`<label>Plan name</label><input name="name" required value="${esc(cur.name)}"><div class="row"><label style="margin:10px 0 0"><input type="checkbox" name="tOTJ" ${cur.types.includes('OTJ')?'checked':''} style="width:auto"> One-time jobs</label><label style="margin:10px 0 0"><input type="checkbox" name="tAMC" ${cur.types.includes('AMC')?'checked':''} style="width:auto"> AMC</label></div><label>Default PDC terms</label>${pdcSelect(cur.pdc)}<label>Instalments — percentage | label | trigger</label><textarea name="lines" rows="6" style="font-family:monospace;font-size:12.5px">${esc(cur.lines)}</textarea><div class="small muted">${esc(TRIG_HELP)}</div>`,async fd=>{
    const types=[];if(fd.tOTJ)types.push('OTJ');if(fd.tAMC)types.push('AMC');if(!types.length)throw new Error('Choose at least one order type');
    for(const t of types){const pr=parseLines(fd.lines,t,12);if(pr.err)throw new Error((types.length>1?'('+t+') ':'')+pr.err)}
    const list={};plansList().forEach(p=>{list[p.id]=p});const pid=id||'p'+Date.now().toString(36);
    list[pid]={id:pid,name:fd.name.trim(),types,pdc:Number(fd.pdc||0),lines:fd.lines.trim()};
    await store.set('settings/plans',{list});toast('Plan saved');
  },'Save plan');
}
function newOtjFromAmc(o){newOrderModal(o)}
function exportCsv(o){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Section','Time (Dubai)','Step / Type','Dept','By','Detail']];
  const w=analyze(o);w.concat(billRows(o,Date.now(),w)).forEach(r=>{if(r.rec&&r.doneAt)rows.push(['Step',fmt(r.doneAt),(r.inst?r.inst.label+' — ':'')+r.st.name,r.rec.byDept,r.rec.byName,(r.state==='skipped'?'SKIPPED ':'')+'took '+dur(r.took||0)+(r.lateDone?' (LATE +'+dur(r.over)+')':'')+(r.rec.note?' | '+r.rec.note:'')+(r.rec.fields?' | '+Object.entries(r.rec.fields).map(([k,v])=>k+': '+v).join(', '):'')])});
  S.events.slice().sort((a,b)=>a.ts-b.ts).forEach(e=>rows.push(['Log',fmt(e.ts),e.type,e.dept,e.byName,e.text]));
  S.chat.slice().sort((a,b)=>a.ts-b.ts).forEach(m=>rows.push(['Chat',fmt(m.ts),'message',m.dept,m.byName,m.text]));
  const blob=new Blob(['﻿'+q('Sales order: '+o.so+' | '+o.client)+'\n'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.so.replace(/[^\w.-]+/g,'_')+'-audit-trail.csv';document.body.appendChild(a);a.click();a.remove();
}

/* ============ EVENTS ============ */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  const o=S.orders.find(x=>x.id===S.orderId);
  if(a==='filter')return;
  if(a==='nav'){S.view=t.dataset.v;unsubs.forEach(f=>f());unsubs=[];sched()}
  else if(a==='logout'){S.user=null;S.err='';unsubs.forEach(f=>f());unsubs=[];sched()}
  else if(a==='open'){S.orderId=t.dataset.id;S.view='order';S.tab='log';openOrder(S.orderId);sched()}
  else if(a==='tab'){S.tab=t.dataset.t;sched()}
  else if(a==='period'){S.period=t.dataset.p;sched()}
  else if(a==='step'&&o)stepModal(o,t.dataset.k,false);
  else if(a==='skip'&&o)stepModal(o,t.dataset.k,true);
  else if(a==='bstep'&&o)billModal(o,t.dataset.ik,t.dataset.k);
  else if(a==='claim'&&o)claimModal(o,t.dataset.ik);
  else if(a==='editPlan'&&o)editPlanModal(o);
  else if(a==='export'&&o)exportCsv(o);
  else if(a==='newOrder')newOrderModal(null);
  else if(a==='newOtj'&&o)newOtjFromAmc(o);
  else if(a==='closeModal')closeModal();
  else if(a==='escalate'&&o){modal('Escalate payment to salesperson',`<p class="small muted">Payment is past the agreed terms. ${esc(o.salesperson||'The salesperson')} will see this order in their queue and is expected to follow up with the client.</p><label>Message to salesperson</label><textarea name="note" rows="3" required></textarea>`,async fd=>{await postEvent(o,'escalate','escalated overdue payment to '+(o.salesperson||'Sales')+' — '+fd.note,{},{escalatedAt:Date.now()});toast('Escalated')},'Escalate')}
  else if(a==='fund'&&o){modal('Log material fund release',`<label>Amount released (AED)</label><input name="amt" type="number" min="1" step="any" required><label>Payment reference / supplier</label><input name="ref"><label>Note (optional)</label><textarea name="note" rows="2"></textarea>`,async fd=>{await postEvent(o,'fund','released AED '+Number(fd.amt).toLocaleString('en-US')+' for material'+(fd.ref?' ('+fd.ref+')':'')+(fd.note?' — '+fd.note:''),{amount:Number(fd.amt)});toast('Fund release logged')},'Log')}
  else if(a==='followup'&&o){modal('Log client follow-up',`<label>What did the client say?</label><textarea name="note" rows="3" required></textarea><label>Promised payment date (optional)</label><input type="date" name="date">`,async fd=>{await postEvent(o,'followup','logged client follow-up — '+fd.note+(fd.date?' (client promised payment by '+fd.date+')':''));toast('Follow-up logged')},'Log')}
  else if(a==='addUser'){modal('Add user',`<label>Full name</label><input name="name" required><label>Department</label><select name="dept">${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select><label>Role</label><select name="role"><option value="user">User</option><option value="admin">Admin (all permissions)</option></select><label>PIN (4–8 digits)</label><input name="pin" pattern="[0-9]{4,8}" required>`,async fd=>{const id='u'+uid();await store.set('users/'+id,{name:fd.name.trim(),dept:fd.dept,role:fd.role,pin:await hashPin(fd.pin,id)});toast('User added')},'Add user')}
  else if(a==='resetPin'){const id=t.dataset.id;modal('Reset PIN',`<label>New PIN (4–8 digits)</label><input name="pin" pattern="[0-9]{4,8}" required>`,async fd=>{await store.update('users/'+id,{pin:await hashPin(fd.pin,id)});toast('PIN reset')},'Reset')}
  else if(a==='delUser'){const id=t.dataset.id;const u=S.users.find(x=>x.id===id);modal('Remove '+(u?u.name:'user')+'?',`<p>This user will no longer be able to sign in. Their past activity stays in the logs.</p>`,async()=>{await store.del('users/'+id)},'Remove')}
  else if(a==='editLib')libModal(t.dataset.id);
  else if(a==='delLib'){const id=t.dataset.id;const p=plansList().find(x=>x.id===id);modal('Delete plan?',`<p>Delete "${esc(p?p.name:'')}"? Existing orders keep their instalments.</p>`,async()=>{const list={};plansList().forEach(x=>{if(x.id!==id)list[x.id]=x});await store.set('settings/plans',{list})},'Delete')}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='filter'){S[t.dataset.k]=t.value;sched()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='filter'){S[t.dataset.k]=t.value;sched()}});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form;const fd=Object.fromEntries(new FormData(f).entries());
  try{
    if(k==='setup'){const id='u'+uid();await store.set('users/'+id,{name:fd.name.trim(),dept:'Management',role:'admin',pin:await hashPin(fd.pin,id)});S.user={id,name:fd.name.trim(),dept:'Management',role:'admin'};S.err='';S.view='dash'}
    else if(k==='login'){const u=S.users.find(x=>x.id===fd.uid);if(!u||u.pin!==await hashPin(fd.pin,u.id)){S.err='Wrong user or PIN';sched();return}S.user=u;S.err='';S.view=u.role==='admin'?'dash':'queue'}
    else if(k==='chat'){const o=S.orders.find(x=>x.id===S.orderId);const text=(fd.text||'').trim();if(!text||!o)return;const inp=$('#chatInput');if(inp)inp.value='';await store.batch([{t:'add',p:'orders/'+o.id+'/chat',d:{ts:Date.now(),text,...me()}}]);return}
    else if(k==='note'){const o=S.orders.find(x=>x.id===S.orderId);const text=(fd.text||'').trim();if(!text||!o)return;const inp=$('#noteInput');if(inp)inp.value='';await postEvent(o,'note','noted: '+text);return}
    else if(k==='sla'){const v={};Object.entries(fd).forEach(([n,x])=>{const [t,s]=n.split('.');(v[t]=v[t]||{})[s]=Number(x)});await store.set('settings/sla',v);toast('Targets saved')}
    sched();
  }catch(er){toast('Could not save: '+(er&&er.message||'try again'))}
});

  const cfg=window.AMT_FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||String(cfg.apiKey).startsWith('PASTE')){
    $('#app').innerHTML='<div class="login card"><h1>Setup needed</h1><p>Open <b>firebase-config.js</b> and paste your Firebase web-app config, then reload. See README.md.</p></div>';return}
  $('#app').innerHTML='<div class="login card"><h1>AMTIDAAD Workflow Tracker</h1><p class="muted">Connecting…</p></div>';
  try{store=await makeFirebaseStore(cfg);boot()}
  catch(e){$('#app').innerHTML='<div class="login card"><h1>Could not connect</h1><p class="err">'+esc(e.message||e)+'</p><p class="small muted">Check firebase-config.js, that Anonymous sign-in is enabled, and that the Firestore rules are published.</p></div>'}
})();
